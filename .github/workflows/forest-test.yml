# Runs the Forests & Biomass module on REAL NISAR GCOV data over an Indian forest, on GitHub's servers.
#
# Needs the same EARTHDATA_TOKEN repository secret as "Real-data test" (Settings -> Secrets and variables ->
# Actions). Run it: Actions tab -> "Forest test" -> Run workflow -> choose a forest.
# Results: the run's Summary page, plus a downloadable "forest" artifact (report, maps, GeoTIFFs, zones, metrics).

name: Forest test

on:
  workflow_dispatch:
    inputs:
      site:
        description: "Forest"
        type: choice
        options: [hasdeo_arand, lunglei_mizoram, wayanad, dehing_patkai, great_nicobar, sundarbans, custom]
        default: hasdeo_arand
      bbox:
        description: "custom only: 'west south east north'"
        default: "82.55 22.70 82.85 22.95"
      start:
        description: "First date (YYYY-MM-DD)"
        default: "2026-06-01"
      end:
        description: "Last date (YYYY-MM-DD, blank = today)"
        default: ""
      max_dates:
        description: "NISAR images to use (spread over the period)"
        type: choice
        options: ["4", "6", "8", "12", "16"]
        default: "12"
      direction:
        description: "Satellite pass"
        type: choice
        options: [any, ASCENDING, DESCENDING]
        default: any

concurrency:  # one queue per forest: runs for different forests go in parallel, never cancel each other
  group: forest-test-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
      SITE: ${{ inputs.site }}
      BBOX_IN: ${{ inputs.bbox }}
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      MAX_DATES: ${{ inputs.max_dates }}
      DIRECTION: ${{ inputs.direction }}
    steps:
      - name: Check the inputs and the Earthdata token
        run: |
          if [ -z "$EARTHDATA_TOKEN" ]; then
            echo "::error::EARTHDATA_TOKEN secret is not set. See the notes at the top of .github/workflows/forest-test.yml."
            exit 1
          fi
          case "$SITE" in
            hasdeo_arand)    BBOX="82.55 22.70 82.85 22.95";;
            lunglei_mizoram) BBOX="92.55 22.75 92.85 23.05";;
            wayanad)         BBOX="76.00 11.60 76.30 11.90";;
            dehing_patkai)   BBOX="95.50 27.20 95.80 27.40";;
            great_nicobar)   BBOX="93.70 6.75 93.95 7.10";;
            sundarbans)      BBOX="88.75 21.65 89.05 21.95";;
            custom)          BBOX="$BBOX_IN";;
            *) echo "::error::unknown site"; exit 1;;
          esac
          set -- $BBOX
          [ $# -eq 4 ] || { echo "::error::bbox must be four numbers"; exit 1; }
          for v in $BBOX; do case "$v" in *[!0-9.-]*|'') echo "::error::bbox must be four numbers"; exit 1;; esac; done
          for d in "$START" "$END"; do
            case "$d" in ''|[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "::error::dates must be YYYY-MM-DD"; exit 1;; esac
          done
          case "$DIRECTION" in any|ASCENDING|DESCENDING) ;; *) echo "::error::unknown direction"; exit 1;; esac
          echo "BBOX=$BBOX" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Biomass and forest loss
        run: |
          extra=""
          [ -n "$END" ] && extra="$extra --end $END"
          [ "$DIRECTION" != any ] && extra="$extra --direction $DIRECTION"
          sarcompare --debug forest --bbox $BBOX --name "$SITE" --start "$START" --max-dates "$MAX_DATES" $extra

      - name: Results summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          site = os.environ["SITE"]
          path = pathlib.Path("outputs") / site / "metrics.json"
          out = []
          if not path.exists():
              out.append(f"## {site}: no results\n\nThe run stopped before producing results; see the step logs above.")
          else:
              m = json.loads(path.read_text())
              def f(v, nd=1):
                  return "n/a" if v is None or v != v else f"{v:,.{nd}f}"
              st, mod, sep = m["stats"], m["biomass_model"], m["forest_open_separation"]
              imgs = m["images"]
              out.append(f"## {site}: Forests & Biomass, real NISAR GCOV\n")
              out.append(f"{len(imgs)} images, {imgs[0]['date']} to {imgs[-1]['date']}, track {imgs[0]['track']} "
                         f"{(imgs[0]['direction'] or '').lower()} frame {imgs[0]['frame']}; date offsets removed (dB): "
                         f"{m['date_offsets_db']}\n")
              out.append(f"Reference: ESA CCI Biomass {m['reference']['cci_year']} (baseline "
                         f"{m['reference']['cci_baseline_year']}), Hansen {m['reference']['hansen_version']}, "
                         f"WorldCover {m['reference']['worldcover']}\n")
              out.append("| | |\n|---|---|")
              for k, label, nd in (("forest_ha", "Forest 2021 (ha)", 0), ("agb_mean_forest", "Mean forest biomass (Mg/ha)", 0),
                                   ("saturated_share", "Share of forest saturated", 2), ("new_ha", "New clearing (ha)", 0),
                                   ("unmapped_ha", "Lost since 2021, not in Hansen (ha)", 0),
                                   ("hansen_ha", "Hansen loss 2021-2025 in zones (ha)", 0)):
                  out.append(f"| {label} | {f(st.get(k), nd)} |")
              if mod:
                  t, tb = mod["test"], mod["test_below_sat"]
                  out.append(f"| Model a, b, c | {mod['a']:.4f}, {mod['b']:.1f}, {mod['c']:.5f} |")
                  out.append(f"| Saturation (Mg/ha) | {f(mod['sat_agb'], 0)} (max reference {f(mod['max_ref'], 0)}) |")
                  out.append(f"| Held-out check | r {f(t['r'], 2)}, RMSE {f(t['rmse'], 0)}, bias {f(t['bias'], 0)} (n {t['n']}) |")
                  out.append(f"| Below saturation | r {f(tb['r'], 2)}, RMSE {f(tb['rmse'], 0)}, rel {f(tb['rel_rmse'], 2)} (n {tb['n']}) |")
              if sep:
                  out.append(f"| Forest / cleared HV (dB) | {f(sep['forest_db'])} / {f(sep['cleared_db'])}, threshold "
                             f"{f(sep['threshold_db'])} ({sep['reference']}) |")
                  out.append(f"| Held-out detection / false alarm | {f(sep['detection'], 2)} / {f(sep['false_alarm'], 2)}, "
                             f"balanced accuracy {f(sep['balanced_accuracy'], 2)} |")
              hy = m["reference"].get("hansen_yearly_loss_ha") or {}
              if hy:
                  out.append("\nHansen loss per year (ha): " + ", ".join(f"{y}: {v:,.0f}" for y, v in hy.items()
                                                                        if int(y) >= 2016))
              if m["zones"]:
                  out.append("\n### Zones (largest 25 per type)\n")
                  out.append("| # | type | ha | lat | lon | when | HV before→after | AGB before | CO2 t | in Hansen | open now |")
                  out.append("|---|---|---|---|---|---|---|---|---|---|---|")
                  zs = sorted(m["zones"], key=lambda z: (z["type"], -z["area_ha"]))
                  shown = {}
                  for z in zs:
                      shown[z["type"]] = shown.get(z["type"], 0) + 1
                      if shown[z["type"]] > 25:
                          continue
                      out.append(f"| {z['zone']} | {z['type']} | {f(z['area_ha'])} | {z['latitude']} | {z['longitude']} | "
                                 f"{z['when']} | {z['hv_before_db']} → {z['hv_after_db']} | {z['biomass_before_mg_ha']} | "
                                 f"{z['co2_t']} | {z['hansen_share']} | {z['open_now_share']} |")
              out.append("\n### Notes\n")
              icon = {"good": "✅", "warn": "⚠️"}
              for n in m["notes"]:
                  out.append(f"- {icon.get(n['level'], 'ℹ️')} **{n['stage']}**: {n['text']}")
          text = "\n".join(out)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write(text + "\n")
          PY

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forest-${{ inputs.site }}
          path: outputs/
          retention-days: 30
          if-no-files-found: warn
